<style>
:root{
  --canopy:#163b2a; --moss:#2f6b4f; --leaf:#4caf7a; --leaf-soft:#dcefd9;
  --sand:#f9f4e8; --paper:#fffdf6; --amber:#f0a430; --clay:#b5532f; --bad:#c94b3d;
  --ink:#3b220d; --muted:#5c3a21; --r:20px;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--sand);
  color:var(--ink);font-family:'Noto Sans Hebrew',system-ui,sans-serif;font-size:17px;line-height:1.55;
  background-image:
    radial-gradient(circle at 10% 10%, rgba(76,175,122,0.06) 0%, transparent 40%),
    radial-gradient(circle at 90% 90%, rgba(47,107,79,0.06) 0%, transparent 40%);
}
h1,h2,.display{font-family:'Noto Sans Hebrew','Noto Sans Hebrew',sans-serif}
h2{font-size:22px;margin:32px 0 16px;font-weight:900;color:var(--canopy);text-align:center}

/* header */
header{
  position:sticky;top:0;z-index:50;
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  padding:14px 18px 22px;color:#fff;
  background:linear-gradient(180deg,var(--moss),var(--canopy));
  box-shadow:0 4px 15px rgba(0,0,0,0.2);
}
header::after{
  content:"";position:absolute;left:0;right:0;bottom:-10px;height:12px;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 12' preserveAspectRatio='none'><path d='M0 0 Q15 12 30 0 T60 0 T90 0 T120 0 V12 H0Z' fill='%23163b2a'/></svg>") repeat-x;
  background-size:60px 12px;
}
header h1{font-size:22px;margin:0;font-weight:900;letter-spacing:.2px;text-shadow:0 2px 4px rgba(0,0,0,0.4)}
.wallet{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.2);padding:4px 14px;border-radius:99px;font-weight:900;font-size:16px;box-shadow:inset 0 2px 4px rgba(0,0,0,0.2)}
.chip b{font-family:'Noto Sans Hebrew',sans-serif;font-size:18px;color:var(--amber)}

main{max-width:1200px;margin:0 auto;padding:18px 16px 0}
.spacer{height:92px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:64px 18px;padding-top:48px}
.big{font-size:22px;font-weight:900;font-family:'Noto Sans Hebrew',sans-serif;color:var(--ink)}
.rank{font-size:14px;color:var(--muted);font-weight:600}

/* wooden cards */
.card{
  background:linear-gradient(180deg,#d8a675,#b47a46);
  border-radius:var(--r);padding:18px 12px;
  border:4px solid #6b421a;
  box-shadow:inset 0 0 10px rgba(0,0,0,0.1),0 8px 0 #5c3a21,0 12px 15px rgba(0,0,0,0.15);
  position:relative;z-index:10;
  text-align:center;
  transition:transform 0.2s;
}
.card::before{
  content:"";position:absolute;top:0;left:0;right:0;bottom:0;
  background:repeating-linear-gradient(to bottom,transparent,transparent 10px,rgba(107,66,26,0.05) 10px,rgba(107,66,26,0.05) 20px);
  border-radius:14px;pointer-events:none;z-index:-1;
}
.card-leaf{position:absolute;font-size:26px;z-index:12;filter:drop-shadow(0 3px 2px rgba(0,0,0,0.3));pointer-events:none}
.leaf-tl{top:-12px;left:-12px;transform:rotate(-45deg)}
.leaf-br{bottom:-12px;right:-12px;transform:rotate(135deg)}
.leaf-tr{top:-12px;right:-12px;transform:rotate(45deg)}

/* one animal per card, peeking from behind the top edge */
.slot{position:relative;display:flex}
.slot .card{flex:1;display:flex;flex-direction:column;justify-content:center}
.peek-animal{
  position:absolute;z-index:1;bottom:calc(100% - 20px);line-height:1;font-size:54px;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,0.3));
  transition:transform 0.3s cubic-bezier(0.175,0.885,0.32,1.275);
}
.peek-animal.p0{left:10%}
.peek-animal.p1{left:50%;margin-left:-27px}
.peek-animal.p2{right:10%}
.slot,.slot .card{min-width:0}
.topic-title{white-space:nowrap;font-size:22px;text-shadow:1px 1px 0 rgba(255,255,255,0.4);margin-bottom:4px}
.topic-title.wrap{white-space:normal;min-height:2.4em;display:flex;align-items:center;justify-content:center;line-height:1.2}
.grid.cats{--cols:2;grid-template-columns:repeat(var(--cols),minmax(0,1fr))}
@media (min-width:520px){.grid.cats{--cols:3}}
@media (min-width:760px){.grid.cats{--cols:4}}
@media (min-width:1100px){.grid.cats{--cols:6}}
.prompt,.question-board,.hero-bubble{text-wrap:balance}

.wood-btn-small{
  background:linear-gradient(180deg,#b97a44,#8b5a2b);
  border:2px solid #5c3a21;color:#fff;border-radius:8px;
  padding:6px 18px;font-weight:900;box-shadow:0 4px 0 #4a2810;
  font-size:15px;margin-top:12px;font-family:'Noto Sans Hebrew',sans-serif;cursor:pointer;
  text-shadow:0 1px 2px rgba(0,0,0,0.5);
}
.bar{height:12px;background:#8b5a2b;border-radius:99px;overflow:hidden;margin-top:14px;border:2px solid #5c3a21;box-shadow:inset 0 2px 4px rgba(0,0,0,0.3)}
.bar span{display:block;height:100%;background:linear-gradient(90deg,#8bc34a,#4caf50);border-radius:99px;transition:width .4s}

/* hero */
.hero-banner{text-align:center;margin:30px auto 40px;position:relative;max-width:450px}
.hero-monkey{font-size:80px;position:absolute;top:-65px;left:50%;transform:translateX(-50%);z-index:1;filter:drop-shadow(0 5px 5px rgba(0,0,0,0.3))}
.hero-bubble{
  background:#fff;border-radius:16px;padding:12px 20px;display:inline-block;position:relative;margin-bottom:16px;
  font-weight:900;color:#163b2a;box-shadow:0 4px 0 rgba(0,0,0,0.1);border:2px solid #e0e0e0;z-index:5;
}
.hero-board{
  background:linear-gradient(180deg,#966030,#6c421e);padding:16px;border-radius:20px;border:4px solid #4a2810;
  position:relative;z-index:10;box-shadow:inset 0 0 10px rgba(0,0,0,0.2),0 8px 0 #3b220d,0 15px 20px rgba(0,0,0,0.3);width:100%;
}
.big-green-btn{
  width:100%;font-size:26px;padding:18px;border-radius:12px;
  background:linear-gradient(180deg,#4caf50,#2e7d32);color:#fff;border:3px solid #a5d6a7;
  box-shadow:0 6px 0 #1b5e20,inset 0 4px 6px rgba(255,255,255,0.3);text-shadow:0 2px 3px rgba(0,0,0,0.4);
  font-family:'Noto Sans Hebrew',sans-serif;font-weight:900;cursor:pointer;transition:transform 0.1s,box-shadow 0.1s;
}
.big-green-btn:active{transform:translateY(6px);box-shadow:0 0 0 #1b5e20,inset 0 4px 6px rgba(255,255,255,0.3)}

/* banner (login / info) */
.banner{
  background:var(--paper);border:3px dashed #b47a46;border-radius:16px;padding:12px 16px;margin:16px 0;
  color:#4a2810;font-weight:800;text-align:center;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;
}

/* play */
.question-board{
  padding:24px;background:var(--paper);border:3px dashed #b47a46;border-radius:20px;margin:16px 0 24px;
  font-size:22px;font-weight:800;text-align:center;color:#4a2810;box-shadow:inset 0 0 20px rgba(180,122,70,0.1);
}
.opts{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0;justify-content:center}
#qcard .opts:not(.ord):has(.opt:nth-child(4)):not(:has(.opt:nth-child(5))){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:min(100%,420px);margin-inline:auto}
#qcard .opts:not(.ord):has(.opt:nth-child(4)):not(:has(.opt:nth-child(5))) .opt{width:100%}
.opt{
  background:linear-gradient(180deg,#e0e0e0,#bdbdbd);color:#333;border:3px solid #9e9e9e;border-radius:16px;
  min-width:80px;font-size:22px;direction:ltr;
  box-shadow:inset 0 2px 4px rgba(255,255,255,0.8),0 6px 0 #757575;
  font-family:'Noto Sans Hebrew',sans-serif;font-weight:900;padding:12px 20px;cursor:pointer;
  transition:transform 0.1s,box-shadow 0.1s,background 0.2s;
}
.opt:active{transform:translateY(6px);box-shadow:inset 0 2px 4px rgba(255,255,255,0.8),0 0 0 #757575}
.opt.sel{background:linear-gradient(180deg,#fff9c4,#fff59d);border-color:#fbc02d;box-shadow:inset 0 2px 4px rgba(255,255,255,0.8),0 6px 0 #f57f17;color:#f57f17}
.opt.good{background:linear-gradient(180deg,#c8e6c9,#a5d6a7);border-color:#4caf50;box-shadow:inset 0 2px 4px rgba(255,255,255,0.8),0 6px 0 #2e7d32;color:#1b5e20}
.opt.bad{background:linear-gradient(180deg,#ffcdd2,#ef9a9a);border-color:#f44336;box-shadow:inset 0 2px 4px rgba(255,255,255,0.8),0 6px 0 #c62828;color:#b71c1c;animation:shake 0.4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
input.num,input.text{font:inherit;font-size:22px;padding:12px 16px;border:3px solid #b47a46;border-radius:14px;width:180px;text-align:center;direction:ltr;background:var(--paper);font-family:'Noto Sans Hebrew',sans-serif;font-weight:900;color:#4a2810}
input.text{width:100%;direction:rtl;text-align:right}
.locked{pointer-events:none}
.prompt{font-size:22px;font-weight:800;margin:6px 0 12px;line-height:1.85}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:'Noto Sans Hebrew',sans-serif}
.seq{min-height:60px;display:flex;flex-wrap:wrap;gap:8px;padding:14px;background:rgba(255,255,255,0.5);border-radius:16px;direction:ltr;margin-bottom:12px;border:2px dashed #b47a46}
.seq span{background:#6b421a;color:#fff;padding:8px 16px;border-radius:12px;font-weight:900;font-family:'Noto Sans Hebrew',sans-serif}
.timer{display:inline-block;margin:4px auto 12px;padding:6px 16px;border-radius:99px;background:var(--moss);color:#fff;font-weight:900;font-family:'Noto Sans Hebrew',sans-serif;font-size:18px;box-shadow:0 3px 0 var(--canopy)}
.timer.urgent{background:var(--bad);animation:shake .4s infinite}
.timer-wrap{text-align:center}
svg.angle{width:100%;max-width:320px;height:auto;display:block;margin:12px auto;touch-action:none;background:rgba(255,255,255,0.5);border-radius:16px;border:3px dashed #b47a46}

/* action buttons */
.action-btn{
  font:inherit;font-weight:900;cursor:pointer;border-radius:16px;padding:14px 28px;font-size:18px;
  background:linear-gradient(180deg,var(--leaf),var(--moss));color:#fff;border:2px solid #81c784;
  box-shadow:0 6px 0 #1b5e20;transition:transform .1s,box-shadow .1s;
}
.action-btn:active{transform:translateY(6px);box-shadow:0 0 0 #1b5e20}
.ghost-btn{
  background:var(--paper);color:var(--muted);border:3px solid #b47a46;box-shadow:0 6px 0 #8b5a2b;
  font-weight:900;border-radius:16px;padding:14px 24px;cursor:pointer;transition:transform 0.1s;font-size:18px;font-family:'Noto Sans Hebrew',sans-serif;
}
.ghost-btn:active{transform:translateY(6px);box-shadow:0 0 0 #8b5a2b}
.ghost-btn:disabled{opacity:.5;cursor:not-allowed}
.ghost-btn.on{background:#4caf50;color:#fff;border-color:#2e7d32;box-shadow:0 6px 0 #1b5e20}

/* feedback */
.feedback{display:flex;gap:16px;align-items:center;padding:18px;border-radius:20px;margin-top:16px;font-weight:800;font-size:18px}
.feedback .mascot{font-size:45px;flex:0 0 auto;filter:drop-shadow(0 2px 2px rgba(0,0,0,0.2))}
.feedback.ok{background:#e8f5e9;color:#2e7d32;border:2px solid #a5d6a7}
.feedback.no{background:#ffebee;color:#c62828;border:2px solid #ef9a9a}

.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:16px}
.seg{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.seg .ghost-btn{font-size:16px;padding:10px 16px;box-shadow:0 4px 0 #8b5a2b}

/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--paper);border-top:3px solid #e0e0e0;box-shadow:0 -4px 20px rgba(0,0,0,.08);z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:transparent;color:#8d6e63;border:none;border-radius:0;padding:12px 4px 14px;font-weight:900;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:'Noto Sans Hebrew',sans-serif;cursor:pointer}
.nav button .e{font-size:24px;filter:grayscale(1) opacity(0.6);transition:0.2s}
.nav button[aria-current="page"]{color:#4caf50;background:linear-gradient(180deg,transparent,rgba(76,175,80,0.1));border-top:3px solid #4caf50;margin-top:-3px}
.nav button[aria-current="page"] .e{filter:none;transform:scale(1.15)}

.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--canopy);color:#fff;padding:14px 24px;border-radius:16px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:900;font-weight:900;white-space:nowrap;box-shadow:0 10px 20px rgba(0,0,0,0.3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-10px)}
.hidden{display:none !important}
.user-chip{position:relative}
.user-btn{cursor:pointer;color:#fff;font:inherit;font-weight:900;display:flex;align-items:center;gap:6px}
.user-btn{white-space:nowrap;max-width:none}.user-name{white-space:nowrap;overflow:visible}
.user-btn img{width:24px;height:24px;border-radius:50%}
.user-menu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;min-width:210px;background:var(--paper);color:var(--ink);border:3px solid #b47a46;border-radius:16px;padding:14px;box-shadow:0 10px 24px rgba(0,0,0,.3);z-index:200;display:flex;flex-direction:column;gap:8px;text-align:center}
.um-name{font-weight:900}.um-mail{font-size:13px;color:var(--muted);direction:ltr}
.gbtn{min-height:44px;display:flex;justify-content:center}
.auth-error{width:100%;color:var(--bad);font-weight:800;font-size:15px}

/* compact play layout */
#qcard{max-width:min(980px,94vw);margin:0 auto;padding:16px 22px}
#qcard .question-board{padding:14px 18px;margin:8px 0 12px}
#qcard .prompt{margin:2px 0 6px;line-height:1.55}
#qcard .bar{margin-top:8px}
#qcard .opts{margin:8px 0;gap:10px}
#qcard .opt{padding:8px 18px;font-size:20px}
#qcard .feedback{padding:10px 16px;margin-top:10px;font-size:17px}
#qcard .feedback .mascot{font-size:34px}
.parts{display:flex;flex-wrap:wrap;gap:6px 22px;justify-content:center;align-items:flex-start}
.parts>.row{margin-top:6px}
.part-fix{direction:rtl;display:block;font-size:15px;font-weight:800;margin-top:4px;text-align:center}
.part-fix.ok{color:#1b5e20}.part-fix.no{color:#b71c1c}
input.num.good{border-color:#2e7d32;background:#e8f5e9}
input.num.bad{border-color:#c62828;background:#ffebee}
@media (max-width:600px){#qcard{padding:14px}}

/* shop & collection */
.shop-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:20px;margin-top:14px}
.collection-shelf{background:linear-gradient(180deg,#81c784,#4caf50);border-radius:20px;padding:20px;display:flex;gap:16px;flex-wrap:wrap;justify-content:center;border:4px solid #388e3c;border-bottom-width:10px;box-shadow:inset 0 4px 0 rgba(255,255,255,0.3)}
.owned-animal{font-size:50px;filter:drop-shadow(0 4px 2px rgba(0,0,0,0.2));animation:float 3s ease-in-out infinite alternate}
@keyframes float{0%{transform:translateY(0)}100%{transform:translateY(-8px)}}

/* ===== no-scroll app shell ===== */
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{position:relative;flex:none;padding:8px 16px 14px}
header h1{font-size:20px}
.chip{padding:2px 12px;font-size:15px}
main{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;padding:12px 14px 12px;overflow:hidden}
main>section{flex:1;min-height:0;display:flex;flex-direction:column}
#view-settings{display:block;overflow-y:auto}
.spacer{display:none}
.nav{position:static;flex:none;padding-bottom:env(safe-area-inset-bottom)}
.nav button{padding:6px 4px 8px;gap:2px;font-size:14px}
.nav button .e{font-size:20px}
.banner{margin:0 0 8px;padding:6px 12px}
.gbtn{min-height:40px}

/* home: everything fits on one screen */
.home-top{flex:none;display:flex;gap:12px;align-items:center;justify-content:center;margin:2px 0 6px}
.home-top .hero-bubble{margin:0;padding:6px 14px;text-align:center;font-size:17px;line-height:1.35}
.home-top .hero-bubble small{display:block;font-size:13px;color:#5c3a21;font-weight:600}
.home-top .hero-board{z-index:0;width:auto;flex:0 1 380px;padding:8px;border-radius:16px;border-width:3px;box-shadow:inset 0 0 10px rgba(0,0,0,.2),0 5px 0 #3b220d,0 8px 12px rgba(0,0,0,.3)}
.home-top .big-green-btn{font-size:clamp(17px,3.4vh,24px);padding:8px 14px;box-shadow:0 4px 0 #1b5e20,inset 0 4px 6px rgba(255,255,255,.3)}
.grid.cats{flex:1;min-height:0;padding-top:0;gap:8px 14px;align-content:center;--an:clamp(26px,5.6vh,50px);--rows:4;grid-template-rows:repeat(var(--rows),minmax(0,210px))}
@media (min-width:700px){.grid.cats{--cols:4;--rows:4}}
@media (min-width:1000px){.grid.cats{--cols:8;--rows:2}}
@media (orientation:landscape) and (max-height:560px){.grid.cats{--cols:8;--rows:2}}
@media (max-width:699px){.grid.cats{--cols:4;--rows:4}}
.cats .slot{padding-top:calc(var(--an)*.63);min-height:0}
.cats .peek-animal{font-size:var(--an);bottom:calc(100% - var(--an))}
.cats .peek-animal.p1{margin-left:calc(var(--an)*-.5)}
.cats .card{container-type:size;padding:6px 8px;border-width:3px;box-shadow:inset 0 0 10px rgba(0,0,0,.1),0 5px 0 #5c3a21,0 8px 10px rgba(0,0,0,.15)}
.cats .card-leaf{font-size:18px}
.cats .card .rank{font-size:clamp(10px,10cqh,14px);margin-top:2px !important}
.cats .wood-btn-small{padding:2px 14px;margin-top:4px;font-size:clamp(10px,10cqh,15px)}
.cats .card .bar{margin-top:6px;height:8px;border-width:1px}
@container (max-height:92px){.cats .card .rank{display:none}}
@container (max-height:66px){.cats .wood-btn-small{display:none}}

/* play: fit the screen height */

      return `כְּבָר יֵשׁ ${givenTxt}, וְלָכֵן הֶחָסֵר הוּא ${fmt(comps[m])}: הַסִּפְרָה ${digit} נִמְצֵאת בַּמָּקוֹם ${PLACE[place]} וְשָׁווֶה ${fmt(comps[m])}. הַפֵּירוּק הַמָּלֵא: <span class="ltr">${fmt(n)} = ${comps.map(fmt).join(' + ')}</span>`;
    })()
  };
}

function genOrder(t) {
  const R = t === 1 ? 999 : t === 2 ? 3000 : 9999;
  const set = new Set();
  while (set.size < 5) set.add(rnd(10, R));
  const nums = [...set];
  const sorted = [...nums].sort((x, y) => x - y);
  return {
    body: `<div class="prompt">יֵשׁ לִלְחוֹץ אוֹ לִגְרוֹר אֶת הַמִּסְפָּרִים מֵהַקָּטָן לַגָּדוֹל.</div>`,
    parts: [{ type: 'order', items: shuffle(nums), ans: sorted }],
    hint: 'מוּמְלָץ לְהַשְׁווֹת קוֹדֶם אֶת מִסְפַּר הַסְּפָרוֹת, וְאָז אֶת הַסְּפָרוֹת הַשְּׂמָאלִיּוֹת בְּיוֹתֵר.',
    explain: `הַסֵּדֶר הַנָּכוֹן: <span class="ltr">${sorted.map(fmt).join(' &lt; ')}</span>`
  };
}

function genNumLine(t) {
  const base = t === 1 ? 100 : t === 2 ? 1000 : 3000;
  const a = rnd(base / 10, base / 10 + 80) * 10;
  const b = a + 100;
  const inside = a + rnd(1, 99);
  const outs = new Set();
  while (outs.size < 3) { const x = Math.random() < .5 ? a - rnd(5, 70) : b + rnd(5, 70); if (x > 0) outs.add(x); }
  const opts = shuffle([inside, ...outs]).map(fmt);
  return {
    body: `<div class="prompt">הַמִּסְפָּרִים <span class="ltr">${fmt(a)}</span> וְ-<span class="ltr">${fmt(b)}</span> הֵם קַצְווֹת הַקֶּטַע.<br>אֵיזֶה מִסְפָּר נִמְצָא בְּתוֹךְ הַקֶּטַע?</div>`,
    parts: [{ type: 'buttons', opts, ans: fmt(inside) }],
    hint: 'הַמִּסְפָּר צָרִיךְ לִהְיוֹת גָּדוֹל מֵהַמִּסְפָּר הַקָּטָן וְקָטָן מֵהַמִּסְפָּר הַגָּדוֹל.',
    explain: `${fmt(inside)} נִמְצָא בֵּין ${fmt(a)} לְ-${fmt(b)}.`
  };
}

function genSeq(t) {
  const k = pick([[1, 2, 5, 10], [10, 20, 50, 100], [100, 200, 500, 1000]][t - 1]);
  const desc = Math.random() < .3;
  const s = desc
    ? k * rnd(7, Math.max(7, Math.min(60, Math.floor(9999 / k))))
    : k * rnd(2, Math.max(2, Math.min(60, Math.floor(9000 / k) - 6)));
  const terms = [0, 1, 2, 3, 4, 5].map(i => s + (desc ? -i : i) * k);
  const blanks = pick([[1, 3], [2, 4], [1, 4]]);
  const sortedBlanks = [...blanks].sort((x, y) => x - y);
  const shown = terms.map((v, i) => blanks.includes(i) ? `<span class="gap">חָסֵר ${sortedBlanks.indexOf(i) + 1}</span>` : fmt(v)).join(', ');
  return {
    body: `<div class="prompt">יֵשׁ לְהַשְׁלִים אֶת הַסִּדְרָה, שֶׁמַּמְשִׁיכָה בִּקְפִיצוֹת שֶׁל ${fmt(k)}:<br><span class="ltr" style="font-size:28px;margin-top:10px">${shown}</span></div>`,
    parts: sortedBlanks.map((bi, j) => ({ type: 'num', label: `חָסֵר ${j + 1}`, ans: terms[bi] })),
    hint: `בְּכָל שָׁלָב יֵשׁ קְפִיצָה קְבוּעָה שֶׁל ${fmt(k)}.`,
    explain: `הַסִּדְרָה הַמְּלֵאָה: ${terms.map(fmt).join(', ')}`
  };
}

function genSeqMember(t) {
  const k = pick([[2, 5, 10], [10, 20, 50], [100, 200, 500]][t - 1]);
  const s = k * rnd(2, Math.max(2, Math.min(60, Math.floor(9000 / k) - 10)));
  const shown = [0, 1, 2, 3].map(i => fmt(s + i * k)).join(', ');
  const m = rnd(6, 30);
  const yes = Math.random() < .5;
  const X = yes ? s + m * k : s + m * k + rnd(1, k - 1);
  const isIn = (X - s) % k === 0;
  return {
    body: `<div class="prompt">סִדְרָה: <span class="ltr">${shown}, ...</span><br>הַאִם הַמִּסְפָּר <span class="ltr" style="font-size:32px">${fmt(X)}</span> יוֹפִיעַ בְּהֶמְשֵׁךְ הַסִּדְרָה?</div>`,
    parts: [{ type: 'buttons', opts: ['כֵּן', 'לֹא'], ans: isIn ? 'כֵּן' : 'לֹא' }],
    hint: 'יֵשׁ לִבְדּוֹק אִם הַהֶפְרֵשׁ בֵּין הַמִּסְפָּר הַמְּבוּקָּשׁ לַמִּסְפָּר הָרִאשׁוֹן מִתְחַלֵּק בִּקְפִיצָה.',
    explain: `הַמִּסְפָּר ${isIn ? 'אָכֵן יוֹפִיעַ' : 'לֹא יוֹפִיעַ'} כִּי הוּא ${isIn ? 'מִתְחַלֵּק' : 'לֹא מִתְחַלֵּק'} בִּקְפִיצוֹת שֶׁל ${fmt(k)}.`
  };
}

function genSameDigits(t) {
  const len = t === 1 ? 3 : 4;
  const odd = Math.random() < .5, smaller = Math.random() < .6;
  const pw = odd ? 'אִי-זוּגִי' : 'זוּגִי', dw = smaller ? 'הַקָּטָן' : 'הַגָּדוֹל';
  let n, valid = [];
  for (;;) {
    n = len === 3 ? rnd(200, 999) : rnd(2000, 9999);
    const d = String(n).split('');
    if (new Set(d).size !== len) continue;
    valid = [...new Set(perms(d).filter(x => x[0] !== '0').map(x => Number(x.join(''))).filter(v => (smaller ? v < n : v > n) && (v % 2 === 1) === odd))];
    if (valid.length) break;
  }
  const check = v => { const s = String(v ?? '').replace(/[,\s]/g, ''); return /^\d+$/.test(s) && valid.includes(Number(s)); };
  return {
    body: `<div class="prompt">יֵשׁ לִכְתּוֹב מִסְפָּר ${pw}, ${dw} מִ-<span class="ltr">${fmt(n)}</span>, הַמּוּרְכָּב מֵאוֹתָן סְפָרוֹת.</div>`,
    parts: [{ type: 'text', check, placeholder: 'הַמִּסְפָּר:' }],
    hint: odd ? 'מִסְפָּר אִי-זוּגִי מִסְתַּיֵּים בִּסְפָרוֹת 1, 3, 5, 7 אוֹ 9.' : 'מִסְפָּר זוּגִי מִסְתַּיֵּים בִּסְפָרוֹת 0, 2, 4, 6 אוֹ 8.',
    explain: q => {
      const mine = Number(String(q.parts[0].v ?? '').replace(/[,\s]/g, ''));
      const others = valid.filter(x => x !== mine);
      const list = others.slice(0, 3).map(fmt).join(', ');
      if (q.result) return others.length ? `אַגַּב, אֶפְשָׁר הָיָה גַּם: ${list}.` : 'זוֹ הָיְיתָה הָאֶפְשָׁרוּת הַיְּחִידָה.';
      return `לְמָשָׁל: ${list}.`;
    }
  };
}

/* ---------- numbers in words ---------- */
const W_ONES = ['', 'אַחַת', 'שְׁתַּיִים', 'שָׁלוֹשׁ', 'אַרְבַּע', 'חָמֵשׁ', 'שֵׁשׁ', 'שֶׁבַע', 'שְׁמוֹנֶה', 'תֵּשַׁע'];
const W_TEENS = ['עֶשֶׂר', 'אַחַת עֶשְׂרֵה', 'שְׁתֵּים עֶשְׂרֵה', 'שְׁלוֹשׁ עֶשְׂרֵה', 'אַרְבַּע עֶשְׂרֵה', 'חֲמֵשׁ עֶשְׂרֵה', 'שֵׁשׁ עֶשְׂרֵה', 'שְׁבַע עֶשְׂרֵה', 'שְׁמוֹנֶה עֶשְׂרֵה', 'תְּשַׁע עֶשְׂרֵה'];
const W_TENS = ['', '', 'עֶשְׂרִים', 'שְׁלוֹשִׁים', 'אַרְבָּעִים', 'חֲמִישִּׁים', 'שִׁישִּׁים', 'שִׁבְעִים', 'שְׁמוֹנִים', 'תִּשְׁעִים'];
const W_THOU = ['', 'אֶלֶף', 'אַלְפַּיִים', 'שְׁלוֹשֶׁת אֲלָפִים', 'אַרְבַּעַת אֲלָפִים', 'חֲמֵשֶׁת אֲלָפִים', 'שֵׁשֶׁת אֲלָפִים', 'שִׁבְעַת אֲלָפִים', 'שְׁמוֹנַת אֲלָפִים', 'תִּשְׁעַת אֲלָפִים'];
function numWords(n) {
  const parts = [];
  const th = Math.floor(n / 1000), h = Math.floor(n % 1000 / 100), r = n % 100;
  if (th) parts.push(W_THOU[th]);
  if (h) parts.push(h === 1 ? 'מֵאָה' : h === 2 ? 'מָאתַיִים' : W_ONES[h] + ' מֵאוֹת');
  if (r) {
    if (r < 10) parts.push(W_ONES[r]);
    else if (r < 20) parts.push(W_TEENS[r - 10]);
    else { parts.push(W_TENS[Math.floor(r / 10)]); if (r % 10) parts.push(W_ONES[r % 10]); }
  }
  if (parts.length > 1) parts[parts.length - 1] = 'וְ' + parts[parts.length - 1];
  return parts.join(' ');
}
function genWords(t) {
  const n = t === 1 ? rnd(101, 999) : rnd(1001, 9999);
  const s = String(n);
  const decoys = new Set();
  let guard = 0;
  while (decoys.size < 3 && guard++ < 200) {
    let d;
    const k = rnd(0, 2);
    if (k === 0) { const a = s.split(''); const i = rnd(0, a.length - 2); [a[i], a[i + 1]] = [a[i + 1], a[i]]; d = Number(a.join('')); }
    else { const a = s.split(''); const i = rnd(0, a.length - 1); a[i] = String(rnd(0, 9)); d = Number(a.join('')); }
    if (d !== n && d > 99 && String(d).length === s.length) decoys.add(d);
  }
  if (Math.random() < .5) {
    return {
      body: `<div class="prompt">אֵיזֶה מִסְפָּר כָּתוּב כָּאן בְּמִילִּים?</div><div class="prompt" style="font-size:26px">${numWords(n)}</div>`,
      parts: [{ type: 'buttons', opts: shuffle([n, ...decoys]).map(fmt), ans: fmt(n) }],
      hint: 'כְּדַאי לִכְתּוֹב אֶת הַסְּפָרוֹת לְפִי הַמָּקוֹם: אֲלָפִים, מֵאוֹת, עֲשָׂרוֹת וִיחִידוֹת.',
      explain: `${numWords(n)} = <span class="ltr">${fmt(n)}</span>`
    };
  }
  return {
    body: `<div class="prompt">יֵשׁ לִכְתּוֹב בְּמִסְפָּרִים:</div><div class="prompt" style="font-size:26px">${numWords(n)}</div>`,
    parts: [{ type: 'num', ans: n }],
    hint: 'כְּדַאי לִכְתּוֹב אֶת הַסְּפָרוֹת לְפִי הַמָּקוֹם: אֲלָפִים, מֵאוֹת, עֲשָׂרוֹת וִיחִידוֹת.',
    explain: `${numWords(n)} = <span class="ltr">${fmt(n)}</span>`
  };
}

/* ---------- greater / smaller by N ---------- */
function genMoreLess(t) {
  const ds = t === 1 ? [10, 20, 50, 100, 200] : t === 2 ? [30, 59, 84, 100, 200, 400] : [59, 84, 100, 250, 400, 1000, 2000];
  const d = pick(ds);
  const R = t === 1 ? [200, 900] : [1000, 7000];
  if (Math.random() < .7) {
    const up = Math.random() < .5;
    const n = rnd(R[0] + (up ? 0 : d), R[1]);
    const ans = up ? n + d : n - d;
    return {
      body: `<div class="prompt">אֵיזֶה מִסְפָּר ${up ? 'גָּדוֹל' : 'קָטַן'} בְּ-<span class="ltr">${fmt(d)}</span> מֵהַמִּסְפָּר <span class="ltr">${fmt(n)}</span>?</div>`,
      parts: [{ type: 'num', ans }],
      hint: up ? 'גָּדוֹל בְּ... פֵּירוּשׁוֹ לְהוֹסִיף.' : 'קָטָן בְּ... פֵּירוּשׁוֹ לְחַסֵּר.',
      explain: `<span class="ltr">${fmt(n)} ${up ? '+' : '−'} ${fmt(d)} = ${fmt(ans)}</span>`
    };
  }
  const b = rnd(R[0], R[1] - d), a = b + d;
  return {
    body: `<div class="prompt">בְּכַמָּה הַמִּסְפָּר <span class="ltr">${fmt(a)}</span> גָּדוֹל מֵהַמִּסְפָּר <span class="ltr">${fmt(b)}</span>?</div>`,
    parts: [{ type: 'num', ans: d }],
    hint: 'כְּדֵי לָדַעַת בְּכַמָּה מִסְפָּר אֶחָד גָּדוֹל מֵהַשֵּׁנִי, מְחַסְּרִים אֶת הַקָּטָן מֵהַגָּדוֹל.',
    explain: `<span class="ltr">${fmt(a)} − ${fmt(b)} = ${fmt(d)}</span>`
  };
}

/* ---------- compare place-value expressions ---------- */
function genPlaceCmp(t) {
  const mk = () => {
    const kind = pick(['h', 'ht', 'tu', 'th']);
    if (kind === 'h') { const h = rnd(1, 9); return { txt: `${h} מֵאוֹת`, v: h * 100 }; }
    if (kind === 'ht') { const h = rnd(1, 9), tn = rnd(1, 9); return { txt: `${h} מֵאוֹת וְ-${tn} עֲשָׂרוֹת`, v: h * 100 + tn * 10 }; }
    if (kind === 'tu') { const tn = rnd(5, 60), u = rnd(1, 25); return { txt: `${tn} עֲשָׂרוֹת וְ-${u} יְחִידוֹת`, v: tn * 10 + u }; }
    const th = rnd(1, 9); return { txt: `${th} אֲלָפִים`, v: th * 1000 };
  };
  let A = mk(), B = mk();
  if (t === 1) { while (A.v >= 1000 || B.v >= 1000) { A = mk(); B = mk(); } }
  if (Math.random() < .25 && A.v % 10 === 0) B = { txt: `${A.v / 10} עֲשָׂרוֹת`, v: A.v };
  const sym = A.v < B.v ? '<' : A.v > B.v ? '>' : '=';
  const box = x => `<span dir="rtl" style="unicode-bidi:isolate;background:#fff8;border-radius:12px;padding:4px 8px;font-weight:800;flex:1 1 0;text-align:center;min-width:0">${x}</span>`;
  return {
    body: `<div class="prompt">יֵשׁ לְסַמֵּן אֶת הַסִּימָן הַמַּתְאִים:</div><div class="prompt" style="direction:ltr;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:nowrap;font-size:clamp(15px,4.4vw,22px)">${box(A.txt)}<b>?</b>${box(B.txt)}</div>`,
    parts: [{ type: 'buttons', opts: ['<', '=', '>'], ans: sym }],
    hint: 'כְּדַאי לַהֲפוֹךְ כָּל צַד לְמִסְפָּר רָגִיל: מֵאָה הִיא 100, עֶשֶׂר הִיא 10, אֶלֶף הוּא 1,000.',
    explain: `${A.txt} = ${fmt(A.v)} וְ-${B.txt} = ${fmt(B.v)}. <span class="ltr">${fmt(A.v)} ${sym === '<' ? '&lt;' : sym === '>' ? '&gt;' : '='} ${fmt(B.v)}</span>`
  };
}

/* ---------- missing number with helper exercise ---------- */
function genEquation(t) {
  const R = t === 1 ? [20, 99] : t === 2 ? [100, 600] : [300, 4000];
  const kind = pick(['add', 'sub1', 'sub2']);
  let a = rnd(R[0], R[1]), b = rnd(R[0], R[1]);
  while (b === a) b = rnd(R[0], R[1]);
  let eq, helper, wrong, ans;
  if (kind === 'add') { const c = a + b; eq = `${fmt(a)} + ___ = ${fmt(c)}`; helper = `${fmt(c)} − ${fmt(a)}`; wrong = [`${fmt(c)} + ${fmt(a)}`, `${fmt(a)} − ${fmt(c)}`]; ans = b; }
  else if (kind === 'sub1') { const A = a + b; eq = `${fmt(A)} − ___ = ${fmt(a)}`; helper = `${fmt(A)} − ${fmt(a)}`; wrong = [`${fmt(A)} + ${fmt(a)}`, `${fmt(a)} − ${fmt(A)}`]; ans = b; }
  else { const A = a + b; eq = `___ − ${fmt(a)} = ${fmt(b)}`; helper = `${fmt(a)} + ${fmt(b)}`; wrong = [`${fmt(b)} − ${fmt(a)}`, `${fmt(a)} − ${fmt(b)}`]; ans = A; }
  const eqText = eq.replace('___', '___');
  return {
    body: `<div class="prompt">יֵשׁ לְהַשְׁלִים אֶת הַמִּסְפָּר הֶחָסֵר:<br><span class="ltr" style="font-size:30px;margin-top:8px">${eqText}</span></div>`,
    parts: [
      { type: 'buttons', label: 'תַּרְגִּיל עֵזֶר', ltr: true, opts: shuffle([helper, ...wrong]), ans: helper },
      { type: 'num', label: 'הַמִּסְפָּר הֶחָסֵר', ans }
    ],
    hint: 'כְּדֵי לִמְצוֹא מִסְפָּר חָסֵר בּוֹחֲרִים תַּרְגִּיל עֵזֶר הָפוּךְ: חִיסּוּר בּוֹדֵק חִיבּוּר, וְחִיבּוּר בּוֹדֵק חִיסּוּר.',
    explain: `תַּרְגִּיל הָעֵזֶר: <span class="ltr">${helper} = ${fmt(ans)}</span>. כָּךְ מִתְקַבֵּל הַמִּסְפָּר הֶחָסֵר ${fmt(ans)}.`
  };
}

/* ---------- multiplication ---------- */
function genMult(t) {
  const facts = t === 1 ? [2, 5, 10] : t === 2 ? [3, 4, 6] : [6, 7, 8, 9];
  const a = pick(facts), b = rnd(2, 10);
  const [x, y] = Math.random() < .5 ? [a, b] : [b, a];
  const p = x * y;
  if (Math.random() < .25) {
    return {
      body: `<div class="prompt"><span class="ltr" style="font-size:34px">___ × ${x} = ${p}</span></div>`,

/* ---------- number line with an arrow ---------- */
function numLineWrite(t) {
  const step = t === 1 ? 10 : pick([10, 100]);
  const span = step * 10;
  const start = step === 10 ? rnd(1, t === 1 ? 9 : 90) * 100 : rnd(1, 8) * 1000;
  const idx = rnd(1, 9), val = start + idx * step;
  const x0 = 30, x1 = 290, y = 80;
  let ticks = '';
  for (let i = 0; i <= 10; i++) {
    const x = x0 + (x1 - x0) * i / 10;
    ticks += `<line x1="${x}" y1="${y - (i % 5 ? 8 : 14)}" x2="${x}" y2="${y + (i % 5 ? 8 : 14)}" stroke="#163b2a" stroke-width="${i % 5 ? 2 : 3}"/>`;
  }
  const ax = x0 + (x1 - x0) * idx / 10;
  const svg = `<svg viewBox="0 0 320 150" style="width:100%;max-width:520px;height:auto;display:block;margin:6px auto" role="img" aria-label="יְשַׁר מִסְפָּרִים"><line x1="${x0 - 10}" y1="${y}" x2="${x1 + 10}" y2="${y}" stroke="#163b2a" stroke-width="4"/>${ticks}<text x="${x0}" y="${y + 38}" text-anchor="middle" font-size="17" font-weight="800" fill="#163b2a" direction="ltr">${fmt(start)}</text><text x="${x1}" y="${y + 38}" text-anchor="middle" font-size="17" font-weight="800" fill="#163b2a">${fmt(start + span)}</text><text x="${(x0 + x1) / 2}" y="${y + 38}" text-anchor="middle" font-size="17" font-weight="800" fill="#163b2a">${fmt(start + span / 2)}</text><path d="M${ax} ${y - 16} l-9 -22 h6 v-18 h6 v18 h6 z" fill="#d84a2b" stroke="#7a1f0e" stroke-width="2"/></svg>`;
  return {
    body: `<div class="prompt">אֵיזֶה מִסְפָּר מְסוּמָּן בְּחֵץ?</div>${svg}`,
    parts: [{ type: 'num', ans: val }],
    hint: `בֵּין שְׁנֵי הַמִּסְפָּרִים הַכְּתוּבִים יֵשׁ 10 קְפִיצוֹת שָׁווֹת. כָּל קְפִיצָה הִיא ${fmt(step)}.`,
    explain: `כָּל קְפִיצָה הִיא ${fmt(step)}. הַחֵץ נִמְצָא אַחֲרֵי ${idx} קְפִיצוֹת מִ-${fmt(start)}, וְלָכֵן הַמִּסְפָּר הוּא ${fmt(val)}.`
  };
}

/* ---------- vertical arithmetic ---------- */
function vertHTML(a, b, op) {
  const sa = String(a), sb = String(b), n = Math.max(sa.length, sb.length);
  const cells = s => [...s.padStart(n, ' ')].map(c => `<td>${c.trim()}</td>`).join('');
  return `<table class="vert" dir="ltr"><tr><td class="vs"></td>${cells(sa)}</tr><tr><td class="vs">${op}</td>${cells(sb)}</tr><tr class="vl"><td class="vs"></td><td colspan="${n}"></td></tr><tr><td class="vs"></td><td colspan="${n}" class="vq">?</td></tr></table>`;
}
function hasCarry(a, b, op) {

  }
  return false;
}

  let a, b;

    a = rnd(lo, hi); b = rnd(lo, hi);

  return {
    body, sig: String(a) + op + b,
    parts: [{ type: 'num', ans }],
    hint: op === '+' ? 'מַתְחִילִים מֵהַיְּחִידוֹת. אִם הַסְּכוּם גָּדוֹל מִ-9, כּוֹתְבִים אֶת הַיְּחִידוֹת וּמַעֲבִירִים אֶת הָעֲשָׂרָה לַטּוּר הַבָּא.' : 'מַתְחִילִים מֵהַיְּחִידוֹת. אִם אִי אֶפְשָׁר לְחַסֵּר, לוֹקְחִים עֲשָׂרָה מֵהַטּוּר הַשְּׂמָאלִי.',

// combine progress made on this device with progress saved in the account: nothing earned is lost
function mergeProgress(L, C) {
  const out = mergeState(C);
  const max = (a, b) => Math.max(a || 0, b || 0);
  out.coins = max(L.coins, C.coins);
  out.sessions = max(L.sessions, C.sessions);
  out.medals = [...new Set([...(C.medals || []), ...(L.medals || [])])];
  out.items = { ...(L.items || {}), ...(C.items || {}) };
  out.gear = { ...(L.gear || {}), ...(C.gear || {}) };
  out.sheetOk = { ...(L.sheetOk || {}), ...(C.sheetOk || {}) };
  out.mastery = { ...(C.mastery || {}) };
  Object.entries(L.mastery || {}).forEach(([id, m]) => {
    const c = out.mastery[id];
    if (!c) { out.mastery[id] = m; return; }
    const best = (m.tier || 0) * 1000 + (m.score || 0) > (c.tier || 0) * 1000 + (c.score || 0) ? { ...m } : { ...c };
    best.medal = !!(m.medal || c.medal); best.trophy = !!(m.trophy || c.trophy);
    out.mastery[id] = best;
  });
  out.stats = { ...(C.stats || {}) };
  Object.entries(L.stats || {}).forEach(([id, st]) => {
    const c = out.stats[id];
    if (!c || st.ok + st.bad > c.ok + c.bad) out.stats[id] = st;
  });
  if (L.today && C.today && L.today.day === C.today.day) out.today = { day: C.today.day, count: max(L.today.count, C.today.count) };
  out.resume = { ...(C.resume || {}), ...(L.resume || {}) };
  if (L.profile && (L.profile.nick || L.profile.gender) && !(C.profile && (C.profile.nick || C.profile.gender))) out.profile = L.profile;
  return out;
}
// progress earned as a guest (not signed in) is ADDED to the account once, then the device keeps only the account's copy
function addProgress(G, C) {
  const out = mergeState(C);
  const n = x => x || 0;
  out.coins = n(C.coins) + n(G.coins);
  out.sessions = n(C.sessions) + n(G.sessions);
  out.medals = [...new Set([...(C.medals || []), ...(G.medals || [])])];
  out.items = { ...(G.items || {}), ...(C.items || {}) };
  out.gear = { ...(G.gear || {}), ...(C.gear || {}) };
  out.sheetOk = { ...(G.sheetOk || {}), ...(C.sheetOk || {}) };
  out.mastery = { ...(C.mastery || {}) };
  Object.entries(G.mastery || {}).forEach(([id, m]) => {
    const c = out.mastery[id];
    if (!c) { out.mastery[id] = m; return; }
    const best = (m.tier || 0) * 1000 + (m.score || 0) > (c.tier || 0) * 1000 + (c.score || 0) ? { ...m } : { ...c };
    best.medal = !!(m.medal || c.medal); best.trophy = !!(m.trophy || c.trophy);
    out.mastery[id] = best;
  });
  out.stats = { ...(C.stats || {}) };
  Object.entries(G.stats || {}).forEach(([id, g]) => {
    const c = out.stats[id] || { ok: 0, bad: 0, h: '' };
    out.stats[id] = { ok: c.ok + g.ok, bad: c.bad + g.bad, h: (c.h + g.h).slice(-12) };
  });
  if (G.today && C.today && G.today.day === C.today.day) out.today = { day: C.today.day, count: n(C.today.count) + n(G.today.count) };
  else if (G.today && G.today.count && (!C.today || G.today.day > C.today.day)) out.today = G.today;
  if (G.profile && (G.profile.nick || G.profile.gender) && !(C.profile && (C.profile.nick || C.profile.gender))) out.profile = G.profile;
  return out;
}

/* ---------- session flow ---------- */
function pickCat() {
  if (session && session.only) return CATS.find(c => c.id === session.only);
  if (session && session.topics) return CATS.find(c => c.id === session.topics[session.done % session.topics.length]);
  const pool = CATS.filter(c => c.id !== lastCat);
  const w = pool.map(c => 110 - mast(c.id).score);
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < pool.length; i++) { r -= w[i]; if (r <= 0) return pool[i]; }
  return pool[pool.length - 1];
}

function planTopics(n) {
  if (!Array.isArray(S.rot)) S.rot = [];
  const valid = new Set(CATS.map(c => c.id));
  S.rot = S.rot.filter(id => valid.has(id));
  const take = k => { // pick k topics from remaining, weaker topics more likely
    const out = [];
    for (let i = 0; i < k && S.rot.length; i++) {
      const w = S.rot.map(id => 110 - mast(id).score);
      let r = Math.random() * w.reduce((a, b) => a + b, 0), j = 0;
      for (; j < S.rot.length - 1; j++) { r -= w[j]; if (r <= 0) break; }
      out.push(S.rot.splice(j, 1)[0]);
    }
    return out;
  };
  let chosen = take(n);
  if (chosen.length < n) {
    S.rot = CATS.map(c => c.id).filter(id => !chosen.includes(id));
    chosen = chosen.concat(take(n - chosen.length));
  }
  if (!S.rot.length) S.rot = CATS.map(c => c.id);
  return n >= 8 ? boostWeak(chosen) : shuffle(chosen);
}
// accuracy per topic from real answers (null when too few answers)
function topicAcc(id) { const st = (S.stats || {})[id]; return st && st.ok + st.bad >= 4 ? st.ok / (st.ok + st.bad) : null; }
// When there is a clear gap between weak and strong topics, a weak topic gets a second question
// in place of a strong topic's question (the strong topic returns first in the next session).
function boostWeak(chosen) {
  const weak = chosen.filter(id => { const a = topicAcc(id); return a !== null && a < 0.6; }).sort((x, y) => topicAcc(x) - topicAcc(y));
  const strong = chosen.filter(id => { const a = topicAcc(id); return a !== null && a >= 0.85; }).sort((x, y) => topicAcc(y) - topicAcc(x));
  const k = Math.min(2, weak.length, strong.length);
  let out = chosen.slice();
  for (let i = 0; i < k; i++) {
    if (topicAcc(strong[i]) - topicAcc(weak[i]) < 0.3) continue;
    out[out.indexOf(strong[i])] = weak[i];
    if (!S.rot.includes(strong[i])) S.rot.unshift(strong[i]);
  }
  for (let t = 0; t < 30; t++) { out = shuffle(out); if (!out.some((id, i) => i && id === out[i - 1])) break; }
  return out;
}
const resumeKey = (kind, only) => kind === 'bonus' ? 'bonus' : (only || 'base');
function startSession(kind, only) {
  const rs = S.resume && S.resume[resumeKey(kind, only)];
  if (rs && rs.done < rs.total && rs.done > 0 && (only || (rs.topics && rs.topics.length))) {
    session = JSON.parse(JSON.stringify(rs));
    toast('מַמְשִׁיכִים מֵאֵיפֹה שֶׁהִפְסַקְנוּ 👍');
    nextQ();
    return;
  }
  session = { kind, only: only || null, total: kind === 'bonus' ? 6 : 8, done: 0, correct: 0, coins: 0 };
  if (!only) {
    const sp = kind === 'base' ? sheetPlan(session.total) : [];
    session.topics = sp.map(x => x.cat).concat(sp.length < session.total ? planTopics(session.total - sp.length) : []);
    session.sheet = sp.map(x => x.id);
    save();
  }
  nextQ();
}

function nextQ() {
  stopTimer();
  if (session.done >= session.total) return endSession();
  // avoid repeating a question (same text/numbers) seen recently, also across sessions
  if (!Array.isArray(S.recent)) S.recent = [];
  const sigOf = body => { let h = 0; for (let i = 0; i < body.length; i++) h = (h * 31 + body.charCodeAt(i)) | 0; return h; };
  let cat, sig;
  for (let tries = 0; tries < 60; tries++) {
    cat = pickCat();
    const sid = session.sheet && session.sheet[session.done];
    let sh = sid ? SHEET.find(x => x.id === sid) : null;
    if (!sh && session.only) { session.usedSheet = session.usedSheet || []; sh = sheetLeft(session.only).find(x => !session.usedSheet.includes(x.id)); if (sh) session.usedSheet.push(sh.id); }
    if (sh) { cat = CATS.find(c => c.id === sh.cat); Q = sh.make(); Q.sheetId = sh.id; sig = sigOf(Q.body + (Q.sig || '')); break; }
    Q = cat.gen(mast(cat.id).tier);
    sig = sigOf(Q.body + (Q.sig || ''));
    if (!S.recent.includes(sig)) break;
  }
  S.recent.push(sig);
  if (S.recent.length > 60) S.recent.shift();
  Q.cat = cat.id; Q.note = ''; Q.result = undefined; Q.earned = 0; Q.timedOut = false; Q.startedAt = Date.now();
  Q.parts.forEach(p => { if (p.type === 'order') p.v = p.items.map(() => null); if (p.type === 'draw') p.v = Q.drawInit; });
  lastCat = cat.id;
  showView('play');
  renderPlay();
  startTimer();
}

function answered(p) {
  if (p.type === 'buttons') return p.v !== undefined;
  if (p.type === 'num' || p.type === 'text') return String(p.v ?? '').trim() !== '';
  if (p.type === 'order') return p.v.every(x => x !== null);
  if (p.type === 'draw') return true;
  return false;
}

const HW_T = { 'עשר': 10, 'עשרה': 10, 'עשרים': 20, 'שלושים': 30, 'ארבעים': 40, 'חמישים': 50, 'חמשים': 50, 'שישים': 60, 'ששים': 60, 'שבעים': 70, 'שמונים': 80, 'תשעים': 90 };

function hebWordsNum(v) {
  const known = w => w in HW_U || w in HW_C || w in HW_T || w in HW_X || w === 'מאות' || w === 'אלפים';
  const toks = String(v ?? '').replace(/[\u0591-\u05c7]/g, '').replace(/[-,.]/g, ' ').trim().split(/\s+/).filter(Boolean)

  if (!toks.length || !toks.every(known)) return NaN;
  let total = 0, cur = 0;
  for (let i = 0; i < toks.length; i++) {
    const w = toks[i], nx = toks[i + 1];
    const u = HW_U[w] ?? HW_C[w];
    if (u !== undefined && nx === 'אלפים') { total += u * 1000; i++; }
    else if (HW_U[w] !== undefined && nx === 'מאות') { cur += HW_U[w] * 100; i++; }
    else if (HW_U[w] !== undefined && (nx === 'עשרה' || nx === 'עשר')) { cur += 10 + HW_U[w]; i++; }
    else if (HW_U[w] !== undefined) cur += HW_U[w];
    else if (HW_T[w] !== undefined) cur += HW_T[w];
    else if (w === 'אלף' || w === 'אלפיים') total += HW_X[w];

function stopTimer() { clearInterval(timerInt); timerInt = null; }
function tick() {

  if (S.settings.timer === 'challenge') {
    const left = Math.max(0, CHALLENGE_MS - elapsed);

function setupDraw(svg, p) {
  const arm = svg.querySelector('#arm'), knob = svg.querySelector('#knob'), sq = svg.querySelector('#sq');
  const cx = 160, cy = 170, L = 110;
  const place = d => {
    const r = d * Math.PI / 180;
    const x = (cx + L * Math.cos(r)).toFixed(1), y = (cy - L * Math.sin(r)).toFixed(1);
    arm.setAttribute('x2', x); arm.setAttribute('y2', y);
    knob.setAttribute('cx', x); knob.setAttribute('cy', y);
    if (sq) sq.style.display = d === 90 ? '' : 'none';
  };
  place(p.v);
  if (Q.result !== undefined) return;
  let dragging = false;
  const move = e => {
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const q = pt.matrixTransform(svg.getScreenCTM().inverse());
    const raw = Math.max(0, Math.min(180, Math.atan2(cy - q.y, q.x - cx) * 180 / Math.PI));
    // the line moves in 3-degree steps: it is either exactly right (90, with the square mark) or clearly not
    const d = Math.round(raw / 3) * 3;
    p.v = d; place(d);
  };
  svg.addEventListener('pointerdown', e => { dragging = true; svg.setPointerCapture(e.pointerId); move(e); });
  svg.addEventListener('pointermove', e => { if (dragging) move(e); });
  svg.addEventListener('pointerup', () => { dragging = false; });
  svg.addEventListener('pointercancel', () => { dragging = false; });
}

function record(ok) {
  const m = mast(Q.cat);
  session.done++;
  session.tc = session.tc || {}; session.tc[Q.cat] = (session.tc[Q.cat] || 0) + 1;
  if (!S.stats) S.stats = {};
  const st = S.stats[Q.cat] || (S.stats[Q.cat] = { ok: 0, bad: 0, h: '' });
  if (ok) st.ok++; else st.bad++;
  if (ok && Q.sheetId) { S.sheetOk = S.sheetOk || {}; S.sheetOk[Q.sheetId] = true; }
  st.h = (st.h + (ok ? '1' : '0')).slice(-12);
  if (!S.resume) S.resume = {};
  S.resume[resumeKey(session.kind, session.only)] = JSON.parse(JSON.stringify(session));
  if (ok) {
    const earn = session.kind === 'bonus' ? 2 : 1;
    Q.earned = earn; session.correct++; session.coins += earn; S.coins += earn;
    m.streak++; m.wrong = 0; m.score = Math.min(100, m.score + 5);
    if (m.streak >= 3 && m.tier < 3) { m.tier++; m.streak = 0; toast(`עָלִית לְרָמַת ${TIERS[m.tier]} בַּנּוֹשֵׂא: ${plain(CATS.find(c => c.id === Q.cat).name)}`); }
  } else {
    m.streak = 0; m.wrong++; m.score = Math.max(0, m.score - 3);
    if (m.wrong >= 2 && m.tier > 1) { m.tier--; m.wrong = 0; }
  }
  if (!m.medal && m.score >= 70) { m.medal = true; S.medals.push(Q.cat); toast('מֶדַלְיַית זָהָב הוּשְׂגָה!'); }
  if (!m.trophy && m.score >= 70 && m.tier >= 3) {
    m.trophy = true;
    const nm = CATS.find(c => c.id === Q.cat).name;
    (session.trophies = session.trophies || []).push(nm);
    toast(`🏆 גָּבִיעַ! אַלּוּפִים בַּנּוֹשֵׂא: ${plain(nm)}`);
  }
  save(); updateWallet();
}

  const el = e.target.closest('.ordwrap .opts.ord .opt:not(.used), .ordwrap .seq span.filled');
  if (!el) return;
  const p = Q.parts[+el.dataset.p];
  const fromSlot = el.dataset.slot !== undefined ? +el.dataset.slot : null;
  const val = fromSlot !== null ? p.v[fromSlot] : p.items[+el.dataset.o];
  drag = { el, p, fromSlot, val, x0: e.clientX, y0: e.clientY, moved: false, ghost: null };
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 8) return;
  if (!drag.moved) {
    drag.moved = true;
    const r = drag.el.getBoundingClientRect();
    const g = drag.el.cloneNode(true); g.classList.add('drag-ghost');
    g.style.width = r.width + 'px'; g.style.height = r.height + 'px';
    const cs = getComputedStyle(drag.el); ['background','color','font','borderRadius','border','boxSizing','textAlign'].forEach(k => { g.style[k] = cs[k]; });
    document.body.appendChild(g); drag.ghost = g; drag.el.style.opacity = '.35';
  }
  e.preventDefault();
  drag.ghost.style.left = (e.clientX - drag.ghost.offsetWidth / 2) + 'px';
  drag.ghost.style.top = (e.clientY - drag.ghost.offsetHeight / 2) + 'px';
  document.querySelectorAll('.ordwrap .seq span.over').forEach(x => x.classList.remove('over'));
  const t = document.elementFromPoint(e.clientX, e.clientY);
  const sl = t && t.closest('.ordwrap .seq span[data-slot]'); if (sl) sl.classList.add('over');
}, { passive: false });
function endDrag(e) {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.ghost) d.ghost.remove();
  d.el.style.opacity = '';
  if (!d.moved) { // a tap on a filled slot sends the number back to the bank
    if (d.fromSlot !== null) { d.p.v[d.fromSlot] = null; renderPlay(); }
    return;
  }
  dragJustEnded = true; setTimeout(() => { dragJustEnded = false; }, 50);
  const t = document.elementFromPoint(e.clientX, e.clientY);
  const sl = t && t.closest('.ordwrap .seq span[data-slot]');
  if (sl) {
    const k = +sl.dataset.slot, prev = d.p.v[k];
    if (d.fromSlot !== null) { d.p.v[d.fromSlot] = prev; d.p.v[k] = d.val; } // swap two slots
    else d.p.v[k] = d.val; // from the bank: the number that was there goes back to the bank
  } else if (d.fromSlot !== null && t && t.closest('.ordwrap .opts.ord')) d.p.v[d.fromSlot] = null;
  renderPlay();
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', e => { if (drag) { if (drag.ghost) drag.ghost.remove(); drag.el.style.opacity = ''; drag = null; } });

document.addEventListener('click', e => {
  const t = e.target;
  const nav = t.closest('.nav [data-go]');
  if (nav) { showView(nav.dataset.go); return; }
  const pr = t.closest('[data-practice]');
  if (pr) { startSession('base', pr.dataset.practice); return; }
  if (t.closest('#startBtn')) { startSession('base'); return; }
  const act = t.closest('[data-act]');
  if (act && act.dataset.act === 'logout') { doLogout(); return; }
  if (act && act.dataset.act === 'usermenu') { $('#userMenu').classList.toggle('hidden'); return; }
  if (!t.closest('#userChip')) { const m = $('#userMenu'); if (m) m.classList.add('hidden'); }
  if (t.closest('#installBtn')) { doInstall(); return; }
  const gd = t.closest('[data-gender]');
  if (gd) { S.profile.gender = gd.dataset.gender; save(); renderSettings(); return; }
  const tm = t.closest('[data-timer]');
  if (tm) { S.settings.timer = tm.dataset.timer; save(); renderSettings(); return; }
  const buy = t.closest('[data-buy]');
  if (buy) { buyItem(buy.dataset.buy); return; }
  if (t.closest('#resetBtn')) { handleReset(); return; }
  if (t.closest('#qcard')) handlePlayClick(t);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (!Q || el.tagName !== 'INPUT' || el.dataset.p === undefined) return;
  Q.parts[+el.dataset.p].v = el.value;
});
document.addEventListener('keydown', e => {
  // Enter checks the answer; a second Enter moves to the next question (held-down Enter is ignored)
  if (e.key !== 'Enter' || e.repeat || currentView !== 'play' || !Q || modalOpen || !session) return;
  if (e.target.tagName === 'TEXTAREA') return;
  e.preventDefault();
  if (Q.result === undefined) check();
  else if ($('#nextBtn')) nextQ();
});

/* ---------- auth state ---------- */
onAuthStateChanged(auth, u => {
  user = u; cloudReady = false;
  updateWallet(); refreshCurrentView();
  if (u) cloudLoad().then(() => { updateWallet(); refreshCurrentView(); });
});

/* ---------- start ---------- */
updateWallet();
showView('home');
renderUserChip();
</script>
</body>
</html>
